name: CI/CD Pipeline — Breast Cancer MLOps (DagsHub)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE: breast-cancer-api

jobs:
  # ── Job 1: Tests ──────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    env:
      DAGSHUB_TOKEN:    ${{ secrets.DAGSHUB_TOKEN }}
      DAGSHUB_USERNAME: akkshay0312

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dagshub

      - name: 🗂️ Generate dataset
        run: python -c "import sys; sys.path.insert(0,'src'); from utils import generate_and_save_data; generate_and_save_data()"

      - name: 🏋️ Train models & log to DagsHub MLflow
        run: python src/train.py

      - name: 🧪 Run unit and API tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            models/training_summary.json
            models/*.txt

  # ── Job 2: Docker Build ───────────────────────────────────────────────────
  docker:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    env:
      DAGSHUB_TOKEN:    ${{ secrets.DAGSHUB_TOKEN }}
      DAGSHUB_USERNAME: akkshay0312

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dagshub

      - name: 🗂️ Generate dataset and train models
        run: |
          mkdir -p mlruns
          python -c "import sys; sys.path.insert(0,'src'); from utils import generate_and_save_data; generate_and_save_data()"
          python src/train.py

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .

      - name: 🩺 Test Docker container
        run: |
          docker run -d --name api-test -p 8000:8000 \
            -e DAGSHUB_TOKEN=${{ secrets.DAGSHUB_TOKEN }} \
            ${{ env.DOCKER_IMAGE }}:latest
          sleep 10
          curl -f http://localhost:8000/health || (docker logs api-test && exit 1)
          docker stop api-test
          docker rm api-test

      - name: 📋 List Docker images
        run: docker images ${{ env.DOCKER_IMAGE }}
